version: "3"
services:
  clash:
    image: dreamacro/clash-premium
    container_name: clash-premium
    restart: always
    ports:
      - "7890:7890/tcp"
      - "7890:7890/udp"
      - "9090:9090"
    volumes:
      - ./cloudflare.yaml:/root/.config/clash/config.yaml
  yacd:
    image: haishanh/yacd:laster
    container_name: yacd
    restart: always
    ports:
      - "8888:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - clash